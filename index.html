<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- (on a phone the keyboard makes the page shorter, so the bars stay over it) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Roru Dashboard</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <!-- installable as an app on the web (see sw.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b1e26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Roru">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="styles.css?v=9b437ff">
  <!-- the web page starts signed out (only the sign-in shows) until the account is read (see app.js) -->
  <script>
    if (!window.__TAURI__) document.documentElement.classList.add('web', 'signed-out');
    if (matchMedia('(max-width: 640px)').matches) document.documentElement.classList.add('mobile');
    // the desktop app has no native title bar: macOS keeps its own buttons, over the tab bar
    if (window.__TAURI__ && /Mac/.test(navigator.platform)) document.documentElement.classList.add('mac');
  </script>
  <script type="module" src="app.js?v=9b437ff"></script>
</head>
<body>
  <nav id="rail"></nav>
  <div id="app">
    <!-- on a phone: the bar on top (back, title, menu) and the one at the bottom (see mobile.js) -->
    <header id="mbar"></header>
    <!-- the window's title bar on the desktop: its empty space drags the window (see bindWindowControls) -->
    <div id="titlebar" data-tauri-drag-region>
      <nav id="tabs" data-tauri-drag-region></nav>
      <div id="winctl" data-tauri-drag-region></div>
    </div>
    <header id="toolbar">
      <div class="repo-title">
        <span class="repo-glyph"></span>
        <span class="repo-text"><span id="repo-name"></span><span id="repo-branch"></span></span>
      </div>
      <div class="tb-sep"></div>
      <div class="mode-toggle" id="mode-toggle" role="tablist">
        <button data-mode="git" role="tab">Git</button>
        <button data-mode="explorer" role="tab" title="Files — browse the folder (Ctrl+E)">Files</button>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-group" id="repo-actions">
        <button class="tb git-only" data-action="fetch" title="Fetch — fetch from all remotes">Fetch</button>
        <button class="tb git-only" data-action="pull" title="Pull — fetch and integrate the upstream">Pull</button>
        <button class="tb git-only" data-action="push" title="Push — push the current branch">Push</button>
        <button class="tb" data-action="terminal" title="Open a terminal in the folder">Terminal</button>
        <div class="tb-sep git-only"></div>
        <button class="tb git-only" data-action="branch" title="Create a branch from HEAD">Branch</button>
        <button class="tb git-only" data-action="stash" title="Stash changes">Stash</button>
        <button class="tb git-only" data-action="pop" title="Apply and drop the latest stash">Pop</button>
      </div>
      <div class="spacer"></div>
      <div id="busy" hidden><span class="spinner"></span><span id="busy-text"></span></div>
      <button class="tb icon-only" data-action="refresh" title="Refresh (F5)"></button>
    </header>
    <div id="op-banner" hidden></div>

    <div id="workspace">
      <aside id="sidebar">
        <div class="git-side">
          <div class="sb-filter"><label class="filter-box"><span class="filter-icon"></span><input type="search" id="branch-filter" placeholder="Filter branches" spellcheck="false"></label></div>
          <div id="sidebar-body"></div>
        </div>
        <div class="ex-side">
          <div class="ex-search"><label class="filter-box"><input type="search" id="ex-search" placeholder="Search files  (Ctrl+F)" spellcheck="false"></label><button class="view-toggle" id="ex-grep"></button></div>
          <div id="ex-tree" tabindex="0"></div>
        </div>
        <div class="note-side"><div id="note-tree"></div></div>
      </aside>
      <div class="splitter v" id="split-sidebar"></div>
      <main id="main"></main>
      <div id="peek" hidden></div>
    </div>

    <div id="mtools"></div>
    <nav id="mnav"></nav>
    <footer id="statusbar">
      <span id="sb-left"></span>
      <span class="spacer"></span>
      <span class="sb-hint">Ctrl + / − to zoom</span>
      <button id="sb-zoom" title="Reset zoom (Ctrl+0)">100%</button>
    </footer>
  </div>

  <div id="zoom-toast" role="status">
    <button data-z="out" title="Zoom out (Ctrl −)">−</button>
    <span class="zt-value">100%</span>
    <button data-z="in" title="Zoom in (Ctrl +)">+</button>
    <button data-z="reset" class="zt-reset" title="Ctrl 0">Reset</button>
  </div>

  <div id="toasts"></div>
  <div id="menu" hidden></div>
  <div id="modal-root"></div>
</body>
</html>
